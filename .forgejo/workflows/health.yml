name: Provider Health Check (Forgejo)

on:
  schedule:
    # Every 6 hours.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: debian-bookworm-flutter

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set env for flutter image
        run: |
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Cache pub deps
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - run: flutter pub get

      # Writes providers.json with the exact production upload path into the
      # workflow's build/ directory; the manifest is uploaded as an artifact.
      - name: Run live provider health check
        env:
          RUN_HEALTH_CHECK: '1'
        run: |
          set -euo pipefail
          export HEALTH_OUTPUT="$PWD/build/providers.json"
          mkdir -p "$(dirname "$HEALTH_OUTPUT")"
          echo "health: output -> $HEALTH_OUTPUT"
          flutter test test/health_check_test.dart

      - name: Show manifest
        run: cat build/providers.json

      - name: Upload manifest artifact
        # The Forgejo-maintained fork has the GHES check removed; the upstream
        # upload-artifact@v4 refuses non-GitHub servers. Pinned to the
        # v4.3.1 commit rather than the movable `v4` tag, per Forgejo's own
        # testing.yml warning that a tag can resolve to a commit without the
        # compatibility patch.
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: providers.json
          path: build/providers.json
          if-no-files-found: ignore

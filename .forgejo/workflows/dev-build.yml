name: Dev Build (Forgejo)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version. Blank = from pubspec.yaml'
        required: false
        type: string

permissions:
  contents: write

env:
  ANDROID_HOME: /opt/android-sdk
  ANDROID_SDK_ROOT: /opt/android-sdk
  PATH: /opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:/opt/hostedtoolcache/flutter/stable-3.44.0-x64/bin:/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.14-7/x64/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version
        id: ver
        run: |
          v="${{ inputs.version }}"
          [ -z "$v" ] && v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "ver=$v" >> $GITHUB_OUTPUT
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Android APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-number=$(date +%y%j%H%M) \
            --build-name=${{ steps.ver.outputs.ver }} \
            --dart-define=GIT_HASH=${{ steps.ver.outputs.hash }} \
            --dart-define=DEV_PROVIDERS=true

      - name: Stage artifacts
        run: |
          mkdir -p /tmp/deploy
          echo "${{ steps.ver.outputs.hash }}" > /tmp/deploy/latest.txt
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$apk" ] || continue
            abi=$(basename "$apk" | sed 's/^app-//; s/-release\.apk$//')
            cp "$apk" "/tmp/deploy/uppidi-upload-${{ steps.ver.outputs.ver }}-${{ steps.ver.outputs.hash }}-android-${abi}.apk"
            cp "$apk" "/tmp/deploy/uppidi-upload-latest-android-${abi}.apk"
          done

      - name: Push to builds branch
        run: |
          git config user.name "uppidi-ci"
          git config user.email "ci@forge.mrs.aager.de"
          git checkout --orphan build-artifacts-${GITHUB_RUN_ID}
          git rm -rf . >/dev/null 2>&1 || true
          cp -r /tmp/deploy/* .
          git add .
          git commit -m "dev build ${{ steps.ver.outputs.ver }} (${{ steps.ver.outputs.hash }})"
          git push origin HEAD:refs/heads/builds --force

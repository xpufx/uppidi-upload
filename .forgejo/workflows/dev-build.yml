name: Dev Build (Forgejo)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version. Blank = from pubspec.yaml'
        required: false
        type: string

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install jq + unzip
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends jq unzip

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Cache pub deps
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache/
          key: pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Git safe.directory for Flutter SDK
        run: |
          d=$(find /opt/hostedtoolcache/flutter -name '.git' -type d -maxdepth 3 2>/dev/null | head -1)
          [ -n "$d" ] && git config --global --add safe.directory "${d%/.git}"

      - name: Set up Android SDK
        run: |
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-sdk
          mkdir -p /opt/android-sdk/cmdline-tools/latest
          mv /tmp/android-sdk/cmdline-tools/* /opt/android-sdk/cmdline-tools/latest/
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 || true
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/opt/android-sdk --licenses 2>&1 || true
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV

      - name: Set up Android signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - run: flutter pub get

      - name: Version
        id: ver
        run: |
          v="${{ inputs.version }}"
          [ -z "$v" ] && v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "ver=$v" >> $GITHUB_OUTPUT
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Android APK
        timeout-minutes: 60
        run: |
          echo "Building APK (GRADLE_OPTS=-Xmx2g, target=android-arm64)..."
          export GRADLE_OPTS="-Xmx2g"
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-number=$(date +%y%j%H%M) \
            --build-name=${{ steps.ver.outputs.ver }} \
            --dart-define=GIT_HASH=${{ steps.ver.outputs.hash }} \
            --dart-define=DEV_PROVIDERS=true
          echo "✅ APK: $(ls -lh build/app/outputs/flutter-apk/app-release.apk | awk '{print $5}')"

      - name: Upload APK to Package Registry
        run: |
          echo "Uploading APK to forge.mrs.aager.de/xpufx/uppidi/package/generic/uppidi/dev ..."
          curl -sS -X PUT \
            -H "Authorization: token ${{ secrets.CI_TOKEN }}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @build/app/outputs/flutter-apk/app-release.apk \
            "https://forge.mrs.aager.de/api/packages/xpufx/generic/uppidi/dev/uppidi-upload-latest.apk"
          echo "✅ Uploaded"
          echo "🔗 https://forge.mrs.aager.de/xpufx/-/packages"

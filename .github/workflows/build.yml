name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (e.g. 1.2.0+6). Blank = from pubspec.yaml'
        required: false
        type: string
      dev:
        description: 'Dev build (DEV_PROVIDERS enabled)'
        required: false
        type: boolean
        default: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      hash: ${{ steps.resolve.outputs.hash }}
      dev_define: ${{ steps.resolve.outputs.dev_define }}
      suffix: ${{ steps.resolve.outputs.suffix }}
    steps:
      - uses: actions/checkout@v6
      - id: resolve
        shell: bash
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ver=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          fi
          hash=$(git rev-parse --short HEAD)
          dev="${{ inputs.dev == true && 'true' || 'false' }}"
          if [ "$dev" = "true" ]; then
            echo "dev_define=--dart-define=DEV_PROVIDERS=true" >> "$GITHUB_OUTPUT"
            echo "suffix=-dev" >> "$GITHUB_OUTPUT"
          else
            echo "dev_define=" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Sync version
        run: |
          sed -i "s/const String appVersion = '[0-9.+]*';/const String appVersion = '${{ needs.version.outputs.version }}';/" lib/core/version.dart
      - name: Set up Android signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - run: |
          flutter build apk --release --split-per-abi \
            --dart-define=GIT_HASH=${{ needs.version.outputs.hash }} \
            ${{ needs.version.outputs.dev_define }}
      - name: Rename APK for upload
        run: |
          cp build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk \
            uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-android-${{ matrix.abi }}${{ needs.version.outputs.suffix }}.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-android-${{ matrix.abi }}${{ needs.version.outputs.suffix }}
          path: uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-android-${{ matrix.abi }}${{ needs.version.outputs.suffix }}.apk

  linux-build:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev
      - run: flutter pub get
      - name: Sync version
        run: |
          sed -i "s/const String appVersion = '[0-9.+]*';/const String appVersion = '${{ needs.version.outputs.version }}';/" lib/core/version.dart
      - run: |
          flutter build linux --release \
            --dart-define=GIT_HASH=${{ needs.version.outputs.hash }} \
            ${{ needs.version.outputs.dev_define }}
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundle-${{ needs.version.outputs.hash }}
          path: build/linux/x64/release/bundle

  linux-tarball:
    needs: [version, linux-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle-${{ needs.version.outputs.hash }}
          path: build/linux/x64/release/bundle
      - name: Package tarball
        run: |
          tar -czf \
            uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-linux.tar.gz \
            -C build/linux/x64/release/bundle .
      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-linux${{ needs.version.outputs.suffix }}
          path: uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-linux.tar.gz

  linux-appimage:
    needs: [version, linux-build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle-${{ needs.version.outputs.hash }}
          path: build/linux/x64/release/bundle
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq file wget appstream squashfs-tools libfuse2
      - name: Build AppImage
        if: ${{ inputs.dev != true }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          bash scripts/build-appimage.sh --no-flutter-build \
            --hash=${{ needs.version.outputs.hash }}
      - name: Upload AppImage
        if: ${{ inputs.dev != true }}
        uses: actions/upload-artifact@v7
        with:
          name: uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-x86_64.AppImage${{ needs.version.outputs.suffix }}
          path: uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-x86_64.AppImage

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Sync version
        shell: bash
        run: |
          sed -i "s/const String appVersion = '[0-9.+]*';/const String appVersion = '${{ needs.version.outputs.version }}';/" lib/core/version.dart
      - shell: bash
        run: |
          flutter build windows --release \
            --dart-define=GIT_HASH=${{ needs.version.outputs.hash }} \
            ${{ needs.version.outputs.dev_define }}
      - name: Package
        shell: bash
        run: |
          archive="uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-windows${{ needs.version.outputs.suffix }}.zip"
          tar -a -c -f "$archive" -C build/windows/x64/runner/Release .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-windows${{ needs.version.outputs.suffix }}
          path: uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-windows.zip

  linux-flatpak:
    needs: [version, linux-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: linux-bundle-${{ needs.version.outputs.hash }}
          path: build/linux/x64/release/bundle
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-1-dev flatpak flatpak-builder imagemagick
      - name: Setup Flatpak runtime
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --noninteractive --user flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08
      - name: Prepare bundle sources
        run: |
          mkdir -p flatpak-src/lib
          cp -r build/linux/x64/release/bundle/* flatpak-src/
          # Bundle libsecret for flutter_secure_storage
          cp /lib/x86_64-linux-gnu/libsecret-1.so.0 flatpak-src/lib/
          # Generate standard icon sizes for desktop integration
          for sz in 48 64 128; do
            srcdir=flatpak-src/share/icons/hicolor/${sz}x${sz}/apps
            mkdir -p "$srcdir"
            convert flatpak-src/share/icons/hicolor/256x256/apps/com.uppidi.uppidi.png \
              -resize ${sz}x${sz} "$srcdir/com.uppidi.uppidi.png"
          done
          # Generate metainfo so flatpak list shows Version column
          mkdir -p flatpak-src/share/metainfo
          sed -e "s/__VERSION__/${{ needs.version.outputs.version }}/g" \
              -e "s/__DATE__/$(date -I)/g" \
              com.uppidi.uppidi.metainfo.xml \
              > flatpak-src/share/metainfo/com.uppidi.uppidi.metainfo.xml
      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --repo=repo --default-branch=${{ needs.version.outputs.version }} build-dir com.uppidi.uppidi.yml
      - name: Create bundle
        run: |
          flatpak build-bundle repo \
            uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-linux.flatpak \
            com.uppidi.uppidi \
            ${{ needs.version.outputs.version }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-linux-flatpak${{ needs.version.outputs.suffix }}
          path: uppidi-upload-${{ needs.version.outputs.version }}-${{ needs.version.outputs.hash }}-linux.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, android, linux-tarball, linux-appimage, linux-flatpak, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v8
      - name: Create draft release
        run: |
          gh release create ${{ github.ref_name }} \
            --draft \
            --generate-notes || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload release assets
        run: |
          gh release upload ${{ github.ref_name }} \
            $(find . -type f -name 'uppidi-upload-*.*') \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}
